spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: online-learning
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/online_learning_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Replace the placeholder locally; environment variables still take priority.
    username: ${GMAIL_USERNAME:dongphhe153306@fpt.edu.vn}
    password: ${GMAIL_APP_PASSWORD:wmxq hkpd apaq xxmc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
app:
  cloudinary:
    # Supply credentials using environment variables or the ignored backend .env file.
    # Never commit actual Cloudinary API keys/secrets as YAML fallback values.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:online-learning}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-base64-secret-with-at-least-256-bits}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:${spring.mail.username}}
  auth:
    verification-token-hours: ${AUTH_VERIFICATION_TOKEN_HOURS:24}
    reset-token-minutes: ${AUTH_RESET_TOKEN_MINUTES:15}
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:30}
  google:
    client-id: ${GOOGLE_CLIENT_ID:853513825612-7quhq8vrckovv5khftljknc4b1h4aspf.apps.googleusercontent.com}
  seed-demo-users:
    enabled: ${SEED_DEMO_USERS:true}
    password: ${DEMO_USER_PASSWORD:Online@123}
